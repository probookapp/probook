[package]
name = "probook"
version = "0.4.2"
description = "Probook - Desktop invoicing and business management software"
authors = ["you"]
edition = "2021"

[lib]
name = "probook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
probook-core = { path = "../crates/probook-core" }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (needed for PgPool type in commands + connection)
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# Security (used directly in commands/mod.rs for auth + backup encryption)
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
