<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Probook</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #ffffff;
      color: #1e3a5f;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 32px;
      animation: fadeIn 0.4s ease-out;
    }

    .logo {
      width: 80px;
      height: 80px;
    }

    .app-name {
      font-size: 80px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .spinner-wrapper {
      margin-top: 64px;
      animation: fadeIn 0.4s ease-out 0.2s both;
    }

    .spinner {
      width: 56px;
      height: 56px;
      border: 5px solid rgba(45, 212, 160, 0.25);
      border-top-color: #2dd4a0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #0f172a;
        color: #e2e8f0;
      }
    }
  </style>
</head>
<body>
  <div class="brand">
    <img src="probook-icon.png" alt="Probook" class="logo" />
    <div class="app-name">Probook</div>
  </div>
  <div class="spinner-wrapper"><div class="spinner"></div></div>
</body>
</html>
